<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        :root {
            --bg: #0b1220;
            --bg2: #0f1b31;
            --surface: rgba(255, 255, 255, 0.06);
            --surface2: rgba(255, 255, 255, 0.10);
            --border: rgba(255, 255, 255, 0.12);
            --border2: rgba(255, 255, 255, 0.18);
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.70);
            --muted2: rgba(255, 255, 255, 0.56);
            --primary: #6ee7ff;
            --primary2: #22c3ee;
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            --ring: 0 0 0 3px rgba(110, 231, 255, 0.30);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            color: var(--text);
            background: radial-gradient(1200px 800px at 20% 10%, #13264a 0%, transparent 60%),
                        radial-gradient(900px 600px at 80% 20%, #1b2a5f 0%, transparent 55%),
                        linear-gradient(180deg, var(--bg), var(--bg2));
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2.2rem;
            width: 100%;
            max-width: 400px;
        }

        .container img {
            display: flex;
            justify-self: center;
        }

        h2 {
            text-align: center;
            margin: 0 0 1.5rem;
            font-size: 1.3rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        input {
            width: 100%;
            padding: 0.55rem 0.7rem;
            margin: 0.75rem 0;
            font: inherit;
            color: var(--text);
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: box-shadow 120ms ease, border-color 120ms ease;
        }

        input::placeholder {
            color: var(--muted2);
        }

        input:focus {
            outline: none;
            border-color: rgba(110, 231, 255, 0.35);
            box-shadow: var(--ring);
        }

        button {
            width: 100%;
            padding: 0.55rem 0.9rem;
            margin-top: 1rem;
            appearance: none;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(110, 231, 255, 0.14), rgba(34, 195, 238, 0.08));
            color: var(--text);
            border-radius: 12px;
            font-weight: 650;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
        }

        button:hover {
            border-color: var(--border2);
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: translateY(0px);
        }

        button:focus-visible {
            outline: none;
            box-shadow: var(--ring);
        }

        .toggle-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: var(--muted);
        }

        .toggle-link a {
            color: var(--primary);
            text-decoration: none;
            transition: color 120ms ease;
        }

        .toggle-link a:hover {
            color: var(--primary2);
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .error-message {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <img alt="logo" src="/img/logo.png" width="150px"/>
    <div id="login-form">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Full Name" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="toggle-link">
            Don't have an account? <a href="#" onclick="toggleForm()">Register here</a>
        </div>
    </div>

    <div id="register-form" class="hidden">
        <h2>Register</h2>
        <form id="register-form-element" action="/api/user" method="POST">
            <input type="text" name="username" placeholder="Full Name" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Create Account</button>
            <div id="register-error" class="error-message hidden"></div>
        </form>
        <div class="toggle-link">
            Already have an account? <a href="#" onclick="toggleForm()">Login here</a>
            <p>We Do Not Store Any Emails, This is Purely To Associate you With your Own Characters</p>
        </div>
    </div>
</div>

<script>
    function toggleForm() {
        document.getElementById('login-form').classList.toggle('hidden');
        document.getElementById('register-form').classList.toggle('hidden');
    }

    (function () {
        const registerForm = document.getElementById('register-form-element');
        const errorEl = document.getElementById('register-error');

        if (!registerForm) return;

        registerForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            errorEl.textContent = '';
            errorEl.classList.add('hidden');

            const formData = new FormData(registerForm);
            const body = new URLSearchParams(formData);

            try {
                const response = await fetch('/api/user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                    },
                    body
                });

                if (response.status === 409) {
                    let data = {};
                    try {
                        data = await response.json();
                    } catch (_) {}
                    errorEl.textContent = data.message || 'That username is already taken. Please choose another.';
                    errorEl.classList.remove('hidden');
                    return;
                }

                if (response.ok) {
                    let data = {};
                    try {
                        data = await response.json();
                    } catch (_) {}
                    const redirectUrl = data.redirectUrl || '/';
                    window.location.href = redirectUrl;
                    return;
                }

                errorEl.textContent = 'Something went wrong while creating your account. Please try again.';
                errorEl.classList.remove('hidden');
            } catch (e) {
                errorEl.textContent = 'Network error. Please check your connection and try again.';
                errorEl.classList.remove('hidden');
            }
        });
    })();
</script>

</body>
</html>
